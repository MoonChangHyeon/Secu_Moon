<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">

<head>
    <title>표준 상세 정보</title>
    <style>
        /* Sidebar Styles */
        .category-list-item {
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
            padding: 12px 20px;
        }

        .category-list-item:hover {
            background-color: #f1f3f5;
        }

        /* Active State matching the reference image (Solid Blue) */
        .category-list-item.active {
            background-color: #0d6efd !important;
            color: white !important;
            border-left-color: #0a58ca;
            font-weight: 600;
        }

        /* Badge color in active state */
        .category-list-item.active .badge {
            background-color: rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        .scrollable-sidebar {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }

        /* Info Box Style */
        .info-box {
            background-color: #e7f1ff;
            border: 1px solid #cff4fc;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: #055160;
            display: flex;
            align-items: flex-start;
        }

        .info-box i {
            font-size: 1.2rem;
            margin-right: 10px;
            margin-top: -2px;
            color: #0dcaf0;
        }

        /* DataTables Custom customization to match clean look */
        .dataTable-wrapper .dataTable-container {
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .dataTable-table {
            border-collapse: collapse;
        }

        .dataTable-table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #495057;
            font-weight: 600;
        }

        .dataTable-top {
            padding: 5px 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dataTable-search .dataTable-input {
            border-radius: 4px;
            border: 1px solid #ced4da;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="d-flex align-items-center pt-3 pb-3 mb-4 border-bottom">
            <a th:href="@{/compliance/viewer/{id}(id=${pack.id})}" class="btn btn-outline-secondary me-3 btn-sm">
                <i class="bi bi-arrow-left"></i> 목록
            </a>
            <div>
                <h2 class="h4 mb-0 fw-bold">
                    <span th:text="${standard.name}"></span>
                </h2>
                <div class="text-muted small mt-1">
                    <span th:text="${pack.name}"></span>
                    <span class="badge bg-secondary ms-1" th:text="${pack.version}"></span>
                </div>
            </div>

            <div class="ms-auto btn-group">
                <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-download me-1"></i> 리포트 다운로드
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item"
                            th:href="@{'/api/compliance/export/standard/' + ${standard.id} + '?type=csv'}"><i
                                class="bi bi-file-earmark-spreadsheet me-2"></i>CSV (.csv)</a></li>
                    <li><a class="dropdown-item"
                            th:href="@{'/api/compliance/export/standard/' + ${standard.id} + '?type=xml'}"><i
                                class="bi bi-file-earmark-code me-2"></i>XML (.xml)</a></li>
                    <li><a class="dropdown-item"
                            th:href="@{'/api/compliance/export/standard/' + ${standard.id} + '?type=json'}"><i
                                class="bi bi-file-code me-2"></i>JSON (.json)</a></li>
                </ul>
            </div>
        </div>

        <div class="row g-0 h-100">
            <!-- Sidebar: Categories List -->
            <div class="col-md-3 border-end">
                <div class="bg-white h-100">
                    <div class="p-3 bg-light border-bottom">
                        <h6 class="mb-0 fw-bold text-dark">Categories</h6>
                    </div>
                    <div class="list-group list-group-flush scrollable-sidebar border-0" id="categoryList">
                        <a th:each="cat, stat : ${standard.categories}"
                            class="list-group-item list-group-item-action category-list-item d-flex justify-content-between align-items-center"
                            th:classappend="${stat.first} ? 'active' : ''"
                            th:onclick="'showCategory(' + ${stat.index} + ', this)'">
                            <span th:text="${cat.name}" class="text-truncate"></span>
                            <span class="badge bg-light text-dark rounded-pill" style="font-size: 0.75rem;"
                                th:text="${#lists.size(cat.mappings)}"></span>
                        </a>
                        <div th:if="${#lists.isEmpty(standard.categories)}"
                            class="list-group-item text-muted text-center p-3">
                            항목이 없습니다.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 ps-md-4 pt-3">
                <div th:each="cat, stat : ${standard.categories}" th:id="'cat-content-' + ${stat.index}"
                    class="category-content-panel h-100" th:classappend="${!stat.first} ? 'd-none' : ''">

                    <div class="h-100">
                        <!-- Info Box -->
                        <div class="info-box shadow-sm">
                            <i class="bi bi-info-circle-fill"></i>
                            <div>
                                <h5 class="fw-bold mb-1" th:text="${cat.name}"></h5>
                                <p class="mb-0 small" th:text="${cat.description ?: '설명이 없습니다.'}"
                                    style="white-space: pre-wrap; opacity: 0.9;"></p>
                            </div>
                        </div>

                        <!-- DataTables -->
                        <div>
                            <div th:if="${!#lists.isEmpty(cat.mappings)}">
                                <table class="table table-hover datatable-mapping w-100" style="font-size: 0.95rem;">
                                    <thead>
                                        <tr>
                                            <th style="width: 25%">Group</th>
                                            <th>Description / Vulnerability</th>
                                            <th style="width: 15%">Compliance</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="map : ${cat.mappings}">
                                            <!-- Group Extraction -->
                                            <td class="align-middle fw-semibold text-secondary"
                                                th:with="split=${#strings.arraySplit(map.internalCategory, ':')}"
                                                th:text="${split.length > 1 ? split[0].trim() : 'General'}"></td>

                                            <td class="align-middle">
                                                <div class="fw-bold text-dark" th:text="${map.internalCategory}"></div>
                                                <!-- <div class="small text-muted">Additional details if available</div> -->
                                            </td>

                                            <td class="align-middle text-center">
                                                <span class="badge bg-info text-dark rounded-pill px-3">Compliant</span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div th:if="${#lists.isEmpty(cat.mappings)}"
                                class="alert alert-light border text-center text-muted p-5">
                                <i class="bi bi-exclamation-circle fs-4 mb-2 d-block"></i>
                                매핑된 취약점 정보가 없습니다.
                            </div>
                        </div>
                    </div>
                </div>

                <!-- If no categories -->
                <div th:if="${#lists.isEmpty(standard.categories)}" class="alert alert-warning text-center mt-5">
                    표시할 상세 내용이 없습니다.
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                // Initialize Simple-DataTables
                const tableElements = document.querySelectorAll('.datatable-mapping');
                tableElements.forEach(el => {
                    new simpleDatatables.DataTable(el, {
                        perPage: 10,
                        perPageSelect: [10, 20, 50, 100],
                        searchable: true,
                        labels: {
                            placeholder: "ID or Title 검색...",
                            perPage: "개씩 보기",
                            noRows: "데이터가 없습니다.",
                            info: "{start} ~ {end} / 전체 {rows} 개",
                        }
                    });
                });
            });

            function showCategory(index, element) {
                // UI Toggle
                document.querySelectorAll('.category-list-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                // Content Toggle
                document.querySelectorAll('.category-content-panel').forEach(el => el.classList.add('d-none'));
                const target = document.getElementById('cat-content-' + index);
                if (target) {
                    target.classList.remove('d-none');
                }
            }
        </script>
    </div>
</body>

</html>
