<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">

<head>
    <title>규정 준수 룰팩 관리</title>
    <style>
        .cursor-pointer {
            cursor: pointer;
        }

        .text-hover-primary:hover {
            color: #0d6efd !important;
            text-decoration: underline !important;
        }
    </style>
</head>

<body>
    <div>
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">규정 관리</h1>
        </div>

        <!-- Nav Tabs -->
        <ul class="nav nav-tabs mb-4" id="complianceTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="internal-tab" data-bs-toggle="tab" data-bs-target="#internal"
                    type="button" role="tab" aria-controls="internal" aria-selected="true">
                    내부 규정 준수 룰팩 관리
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="custom-tab" data-bs-toggle="tab" data-bs-target="#custom" type="button"
                    role="tab" aria-controls="custom" aria-selected="false">
                    커스텀
                </button>
            </li>
        </ul>

        <div class="tab-content" id="complianceTabContent">
            <!-- TAB 1: 내부 규정 준수 룰팩 관리 (Uses internalPacks) -->
            <div class="tab-pane fade show active" id="internal" role="tabpanel" aria-labelledby="internal-tab">
                <div class="d-flex justify-content-between mb-3">
                    <div>
                        <a href="/compliance/compare" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-left-right"></i> 룰팩 버전 비교
                        </a>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal"
                        data-bs-target="#uploadModalInternal">
                        <i class="bi bi-upload"></i> 내부 룰팩 업로드
                    </button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>버전</th>
                                        <th>이름</th>
                                        <th>언어</th>
                                        <th>Pack ID</th>
                                        <th>업로드 일시</th>
                                        <th>작업</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="pack : ${internalPacks}">
                                        <td>
                                            <a th:href="@{'/compliance/viewer/' + ${pack.id}}" th:text="${pack.version}"
                                                class="fw-bold text-decoration-none"></a>
                                        </td>
                                        <td th:text="${pack.name}"></td>
                                        <td><span class="badge bg-secondary" th:text="${pack.locale}"></span></td>
                                        <td th:text="${pack.packId}" class="text-muted small"></td>
                                        <td th:text="${#temporals.format(pack.uploadDate, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-danger"
                                                th:onclick="'deletePack(' + ${pack.id} + ')'" title="삭제">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(internalPacks)}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="bi bi-inbox display-4 d-block mb-3"></i>
                                            업로드된 룰팩이 없습니다.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: 커스텀 (Uses customPacks) -->
            <div class="tab-pane fade" id="custom" role="tabpanel" aria-labelledby="custom-tab">
                <div class="d-flex justify-content-end mb-3">
                    <button type="button" class="btn btn-sm btn-success" data-bs-toggle="modal"
                        data-bs-target="#uploadModalCustom">
                        <i class="bi bi-upload"></i> 커스텀 룰팩 업로드
                    </button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>버전</th>
                                        <th>이름</th>
                                        <th>언어</th>
                                        <th>Pack ID</th>
                                        <th>업로드 일시</th>
                                        <th>작업</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="pack : ${customPacks}">
                                        <td>
                                            <a th:href="@{'/compliance/viewer/' + ${pack.id}}" th:text="${pack.version}"
                                                class="fw-bold text-success text-decoration-none text-hover-primary"></a>
                                        </td>
                                        <td th:text="${pack.name}"></td>
                                        <td><span class="badge bg-secondary" th:text="${pack.locale}"></span></td>
                                        <td th:text="${pack.packId}" class="text-muted small"></td>
                                        <td th:text="${#temporals.format(pack.uploadDate, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-danger"
                                                th:onclick="'deletePack(' + ${pack.id} + ')'" title="삭제">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(customPacks)}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="bi bi-inbox display-4 d-block mb-3"></i>
                                            업로드된 룰팩이 없습니다.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 내부 룰팩 업로드 모달 -->
        <div class="modal fade" id="uploadModalInternal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">내부 룰팩 업로드</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="uploadFormInternal">
                            <div class="mb-3">
                                <label for="fileInternal" class="form-label">XML 파일 선택</label>
                                <input class="form-control" type="file" id="fileInternal" required accept=".xml">
                                <div class="form-text">Fortify 'externalmetadata' 형식의 파일을 업로드하세요.</div>
                            </div>
                        </form>
                        <div id="progressInternal" class="progress d-none mb-3">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                                style="width: 100%"></div>
                        </div>
                        <div id="errorInternal" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="button" class="btn btn-primary" onclick="uploadPack('Internal')">업로드</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 커스텀 룰팩 업로드 모달 -->
        <div class="modal fade" id="uploadModalCustom" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">커스텀 룰팩 업로드</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="uploadFormCustom">
                            <div class="mb-3">
                                <label for="fileCustom" class="form-label">XML 파일 선택</label>
                                <input class="form-control" type="file" id="fileCustom" required accept=".xml">
                                <div class="form-text">사용자 정의(KISA 49개 규정 등) XML 파일을 업로드하세요.</div>
                            </div>
                        </form>
                        <div id="progressCustom" class="progress d-none mb-3">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                                role="progressbar" style="width: 100%"></div>
                        </div>
                        <div id="errorCustom" class="alert alert-danger d-none"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                        <button type="button" class="btn btn-success" onclick="uploadPack('Custom')">커스텀 업로드</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            // 공통 업로드 함수
            function uploadPack(type) { // type: 'Internal' or 'Custom'
                const fileInput = document.getElementById('file' + type);
                if (!fileInput.files[0]) {
                    alert('파일을 선택해주세요.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                // Add isCustom flag
                const isCustom = (type === 'Custom');
                formData.append('isCustom', isCustom);

                const progressBar = document.getElementById('progress' + type);
                const errorAlert = document.getElementById('error' + type);
                const uploadBtn = document.querySelector(`#uploadModal${type} .btn-${type === 'Internal' ? 'primary' : 'success'}`);

                progressBar.classList.remove('d-none');
                errorAlert.classList.add('d-none');
                uploadBtn.disabled = true;

                // CSRF Token
                const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
                const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

                fetch('/api/rulepacks/upload', {
                    method: 'POST',
                    headers: {
                        [csrfHeader]: csrfToken
                    },
                    body: formData
                })
                    .then(async response => {
                        if (!response.ok) {
                            const text = await response.text();
                            throw new Error(text || '업로드 실패');
                        }
                        return response.json(); // Wait for JSON to confirm
                    })
                    .then(data => {
                        alert('업로드 완료: ' + data.name);
                        location.reload();
                    })
                    .catch(error => {
                        errorAlert.textContent = error.message;
                        errorAlert.classList.remove('d-none');
                        progressBar.classList.add('d-none');
                        uploadBtn.disabled = false;
                    });
            }

            function deletePack(id) {
                if (!confirm('정말 이 룰팩을 삭제하시겠습니까?')) return;

                const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
                const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

                fetch('/api/rulepacks/' + id, {
                    method: 'DELETE',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        } else {
                            alert('삭제에 실패했습니다.');
                        }
                    });
            }

            // Tab persistence (optional, improve user experience)
            document.addEventListener('DOMContentLoaded', () => {
                const activeTab = localStorage.getItem('activeComplianceTab');
                if (activeTab) {
                    const tabEl = document.querySelector(`button[data-bs-target="${activeTab}"]`);
                    if (tabEl) {
                        const tab = new bootstrap.Tab(tabEl);
                        tab.show();
                    }
                }

                const tabEls = document.querySelectorAll('button[data-bs-toggle="tab"]');
                tabEls.forEach(tabEl => {
                    tabEl.addEventListener('shown.bs.tab', event => {
                        localStorage.setItem('activeComplianceTab', event.target.getAttribute('data-bs-target'));
                    });
                });
            });
        </script>
    </div>
</body>

</html>
