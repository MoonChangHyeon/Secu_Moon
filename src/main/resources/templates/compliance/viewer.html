<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">

<head>
    <title>룰팩 상세 정보</title>
    <style>
        /* Sidebar Styles */
        .category-list-item {
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
            padding: 12px 20px;
        }

        .category-list-item:hover {
            background-color: #f1f3f5;
        }

        /* Active State matching the reference image (Solid Blue) */
        .category-list-item.active {
            background-color: #0d6efd !important;
            color: white !important;
            border-left-color: #0a58ca;
            font-weight: 600;
        }

        /* Badge color in active state */
        .category-list-item.active .badge {
            background-color: rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        .scrollable-sidebar {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }

        /* Info Box Style */
        .info-box {
            background-color: #e7f1ff;
            border: 1px solid #cff4fc;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: #055160;
            display: flex;
            align-items: flex-start;
        }

        .info-box i {
            font-size: 1.2rem;
            margin-right: 10px;
            margin-top: -2px;
            color: #0dcaf0;
        }

        /* DataTables Custom customization */
        .dataTable-wrapper .dataTable-container {
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }

        .dataTable-table {
            border-collapse: collapse;
        }

        .dataTable-table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #495057;
            font-weight: 600;
        }

        .dataTable-top {
            padding: 5px 0 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dataTable-search .dataTable-input {
            border-radius: 4px;
            border: 1px solid #ced4da;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <!-- Header Section -->
        <div class="d-flex align-items-center pt-3 pb-3 mb-4 border-bottom">
            <a href="/compliance" class="btn btn-outline-secondary me-3 btn-sm">
                <i class="bi bi-arrow-left"></i> 목록
            </a>
            <div>
                <h1 class="h4 mb-0 fw-bold">
                    <span th:text="${pack.name}"></span>
                </h1>
                <div class="text-muted small mt-1">
                    <span class="badge bg-secondary me-1" th:text="${pack.version}"></span>
                    <span th:text="'Updated: ' + ${#temporals.format(pack.uploadDate, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
            </div>

            <div class="ms-auto btn-group">
                <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="bi bi-download me-1"></i> 전체 리포트
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{'/api/compliance/export/' + ${pack.id} + '?type=csv'}"><i
                                class="bi bi-file-earmark-spreadsheet me-2"></i>CSV</a></li>
                    <li><a class="dropdown-item" th:href="@{'/api/compliance/export/' + ${pack.id} + '?type=xml'}"><i
                                class="bi bi-file-earmark-code me-2"></i>XML</a></li>
                </ul>
            </div>
        </div>

        <div class="row g-0 h-100">
            <!-- Sidebar: Categories -->
            <div class="col-md-3 border-end">
                <div class="bg-white h-100">
                    <div class="p-3 bg-light border-bottom">
                        <h6 class="mb-0 fw-bold text-dark">Categories</h6>
                    </div>
                    <!-- 카테고리 목록: Map<String, List<Standard>> 형태 -->
                    <div class="list-group list-group-flush scrollable-sidebar border-0" id="categoryList">
                        <a th:each="entry, stat : ${groupedStandards}"
                            class="list-group-item list-group-item-action category-list-item d-flex justify-content-between align-items-center"
                            th:classappend="${stat.first} ? 'active' : ''"
                            th:onclick="'showCategory(' + ${stat.index} + ', this)'">
                            <span th:text="${entry.key}" class="text-truncate"></span>
                            <span class="badge bg-light text-dark rounded-pill" style="font-size: 0.75rem;"
                                th:text="${#lists.size(entry.value)}"></span>
                        </a>
                        <div th:if="${#maps.isEmpty(groupedStandards)}"
                            class="list-group-item text-muted text-center p-3">
                            항목이 없습니다.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content: Standard List -->
            <div class="col-md-9 ps-md-4 pt-3">
                <!-- Content Iterate -->
                <div th:each="entry, stat : ${groupedStandards}" th:id="'cat-content-' + ${stat.index}"
                    class="category-content-panel h-100" th:classappend="${!stat.first} ? 'd-none' : ''">

                    <div class="h-100">
                        <!-- Info Box mimicking summary -->
                        <div class="info-box shadow-sm">
                            <i class="bi bi-card-checklist"></i>
                            <div>
                                <h5 class="fw-bold mb-1" th:text="${entry.key}"></h5>
                                <p class="mb-0 small text-muted">
                                    총 <span class="fw-bold text-dark" th:text="${#lists.size(entry.value)}"></span> 개의
                                    표준 항목이 포함되어 있습니다.
                                </p>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover datatable-standard w-100" style="font-size: 0.95rem;">
                                <thead>
                                    <tr>
                                        <th style="width: 30%;">Name</th>
                                        <th>Description</th>
                                        <th style="width: 100px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="std : ${entry.value}" style="cursor: pointer;"
                                        th:onclick="'location.href=\'' + @{/compliance/viewer/{packId}/standard/{stdId}(packId=${pack.id}, stdId=${std.id})} + '\''">
                                        <td class="fw-bold text-primary align-middle" th:text="${std.name}"></td>
                                        <td class="text-secondary small align-middle text-truncate"
                                            style="max-width: 400px;" th:text="${std.description}"></td>
                                        <td class="align-middle text-end">
                                            <a th:href="@{/compliance/viewer/{packId}/standard/{stdId}(packId=${pack.id}, stdId=${std.id})}"
                                                class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                                Detail
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- If no standards -->
                <div th:if="${#maps.isEmpty(groupedStandards)}" class="alert alert-warning text-center mt-5">
                    표시할 항목이 없습니다.
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                // Initialize DataTables
                const tableElements = document.querySelectorAll('.datatable-standard');
                tableElements.forEach(el => {
                    new simpleDatatables.DataTable(el, {
                        perPage: 10,
                        perPageSelect: [10, 20, 50, 100],
                        searchable: true,
                        labels: {
                            placeholder: "표준명 검색...",
                            perPage: "개씩 보기",
                            noRows: "데이터가 없습니다.",
                            info: "{start} ~ {end} / 전체 {rows} 개",
                        }
                    });
                });
            });

            function showCategory(index, element) {
                // UI Toggle
                document.querySelectorAll('.category-list-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                // Content Toggle
                document.querySelectorAll('.category-content-panel').forEach(el => el.classList.add('d-none'));
                const target = document.getElementById('cat-content-' + index);
                if (target) target.classList.remove('d-none');
            }
        </script>
    </div>
</body>

</html>
