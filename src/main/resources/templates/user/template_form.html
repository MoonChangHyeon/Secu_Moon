<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Role Template Form</title>
</head>

<body>
    <div layout:fragment="content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2" th:text="${template != null} ? 'Edit Template' : 'Create Template'">Create Template</h1>
        </div>

        <form
            th:action="${template != null} ? @{/user/templates/{id}/update(id=${template.id})} : @{/user/templates/create}"
            method="post" style="max-width: 600px;">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" th:value="${template?.name}" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                    th:text="${template?.description}"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Privileges</label>
                <div class="card p-3" style="max-height: 300px; overflow-y: auto;">
                    <div th:each="privilege : ${privileges}" class="form-check">
                        <input class="form-check-input" type="checkbox" name="privilegeIds" th:value="${privilege.id}"
                            th:id="${'priv_' + privilege.id}"
                            th:checked="${template != null and template.privileges.contains(privilege)}">
                        <label class="form-check-label" th:for="${'priv_' + privilege.id}">
                            <strong th:text="${privilege.name}"></strong> <small
                                th:text="${' - ' + privilege.description}"></small>
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/user/templates}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>

</html>
